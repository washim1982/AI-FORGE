<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Forge agent mark for the Code-OSS activity bar. The workbench tints this
       icon itself, so it must stay single-colour currentColor line art at
       24px. Matches assets/branding/forge-mark.svg's gem, simplified to an
       outline plus its girdle/centre facet lines — enough detail to read as
       a cut gem rather than a plain kite shape at this size.
       Source for extensions/forge-agent/media/forge.svg; run `npm run icons`. -->
  <path d="M9,3 L15,3 L20,9 L12,21 L4,9 Z"
        stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M4,9 L20,9 M12,9 L12,21" stroke="currentColor" stroke-width="1.1" opacity=".8"/>
</svg>
